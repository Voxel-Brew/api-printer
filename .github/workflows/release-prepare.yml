name: Prepare release
on:
  workflow_dispatch:
    inputs:
      bom-version:
        description: "Released BOM version (blank removes -SNAPSHOT from current version)"
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: api-release-mutations
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test .github/scripts/release.test.cjs
      - name: Create release branch and advance master
        env:
          BOM_VERSION: ${{ inputs.bom-version }}
        run: node .github/scripts/release.cjs prepare
      - name: Explicitly check the new master snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml --ref master
