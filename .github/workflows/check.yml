name: API checks and snapshots
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
env:
  GITHUB_PACKAGES_USER: ${{ vars.PACKAGES_USER || github.actor }}
  GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Voxel-Brew/BOM
          path: .tools/bom
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Java member order
        run: ./gradlew --refresh-dependencies checkJavaMemberOrder
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: ./gradlew --refresh-dependencies check -x :checkJavaMemberOrder
  publish:
    needs: verify
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Voxel-Brew/BOM
          path: .tools/bom
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Require a snapshot version
        run: grep -Eq '^projectVersion=.+-SNAPSHOT$' gradle.properties
      - run: ./gradlew --refresh-dependencies publishApiPublicationToGitHubPackagesRepository
