name: API checks and snapshots
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: api
      - uses: actions/checkout@v4
        with:
          repository: Voxel-Brew/api-model
          ref: master
          path: dependencies/model
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check --include-build ../dependencies/model
        working-directory: api
  publish:
    needs: verify
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PACKAGES_USER: ${{ vars.PACKAGES_USER || github.actor }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Require a snapshot version
        run: grep -Eq '^projectVersion=.+-SNAPSHOT$' gradle.properties
      - run: ./gradlew publishApiPublicationToGitHubPackagesRepository
