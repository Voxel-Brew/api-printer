name: Merge release fixes back to master
on:
  push:
    branches: ["release/*"]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: merge-back-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  merge:
    if: startsWith(github.ref, 'refs/heads/release/') && (github.event_name != 'push' || !github.event.deleted)
    runs-on: ubuntu-24.04
    env:
      RELEASE_BRANCH: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ env.GH_TOKEN }}
      - name: Merge release changes and open a pull request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_BRANCH" =~ ^release/[0-9]+\.[0-9]+\.x$ ]]
          source=$(git rev-parse "refs/remotes/origin/$RELEASE_BRANCH")
          base=$(git merge-base HEAD "$source")
          if [[ "$base" == "$source" ]]; then exit 0; fi

          # Keep master's projectVersion while three-way merging every other property.
          version=$(sed -n 's/^projectVersion=//p' gradle.properties)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?$ ]]
          for revision in HEAD "$base" "$source"; do
            git show "$revision:gradle.properties" | sed "s/^projectVersion=.*/projectVersion=$version/" > "$RUNNER_TEMP/$revision.properties"
          done
          git merge-file -p "$RUNNER_TEMP/HEAD.properties" "$RUNNER_TEMP/$base.properties" "$RUNNER_TEMP/$source.properties" > "$RUNNER_TEMP/merged.properties"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff "$source" || git rev-parse --verify MERGE_HEAD
          cp "$RUNNER_TEMP/merged.properties" gradle.properties
          git add gradle.properties
          test -z "$(git diff --name-only --diff-filter=U)"
          branch="automation/merge-back/${RELEASE_BRANCH#release/}"
          title="Merge $RELEASE_BRANCH fixes into master"
          if git diff --cached --quiet && ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then exit 0; fi
          git commit -m "$title"
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          if [[ -z "$(gh pr list --base master --head "$branch" --state open --json number --jq '.[0].number // empty')" ]]; then
            gh pr create --base master --head "$branch" --title "$title" --body "Preserves master's projectVersion."
          fi
