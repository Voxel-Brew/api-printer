name: Publish to prod
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Validate the release without signing, uploading, tagging or changing remote branches"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: api-release-mutations
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: gradle/actions/setup-gradle@v4
      - run: node --test .github/scripts/release.test.cjs
      - name: Prepare immutable candidate from release branch
        run: node .github/scripts/release.cjs candidate
      - name: Verify release using published dependencies from Maven Central
        run: ./gradlew check verifyRelease jar sourcesJar javadocJar generatePomFileForApiPublication
      - name: Validate publishing secrets and signing key
        if: ${{ !inputs.dry-run }}
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_RING_BASE64: ${{ secrets.SIGNING_KEY_RING_BASE64 }}
        run: |
          set -euo pipefail
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY_ID SIGNING_KEY_RING_BASE64; do
            test -n "${!name}" || { echo "Missing secret: $name"; exit 1; }
          done
          install -d -m 700 "$RUNNER_TEMP/api-signing"
          printf '%s' "$SIGNING_KEY_RING_BASE64" | base64 --decode > "$RUNNER_TEMP/api-signing/secring.gpg"
          chmod 600 "$RUNNER_TEMP/api-signing/secring.gpg"
          gpg --batch --with-colons --show-keys "$RUNNER_TEMP/api-signing/secring.gpg" > "$RUNNER_TEMP/api-signing/metadata"
          node .github/scripts/check-signing-key.cjs "$RUNNER_TEMP/api-signing/metadata"
      - name: Sign the verified candidate before reserving its tag
        if: ${{ !inputs.dry-run }}
        env:
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_RING: ${{ runner.temp }}/api-signing/secring.gpg
        run: ./gradlew signApiPublication -PcentralRelease=true
      - name: Reserve immutable release tag (retained if upload fails)
        if: ${{ !inputs.dry-run }}
        run: node .github/scripts/release.cjs tag
      - name: Publish signed artifacts and wait for Central publication
        if: ${{ !inputs.dry-run }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_RING: ${{ runner.temp }}/api-signing/secring.gpg
        run: ./gradlew publishAndReleaseToMavenCentral -PcentralRelease=true
      - name: Publish GitHub release and advance release branch snapshot
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.cjs finish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-release-evidence
          path: |
            build/reports/
            build/publications/api/pom-default.xml
            build/libs/*.jar
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/api-signing"
